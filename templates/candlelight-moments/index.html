<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<title>Candlelight Moments Demo</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at center,#2b160c,#0d0503);
  color:#ffd8a8;
  font-family:'Poppins',sans-serif;
}

/* glow */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 70%, rgba(255,180,90,.25), transparent 60%);
  animation:flicker 4s infinite alternate;
}
@keyframes flicker{from{opacity:.6}to{opacity:1}}

/* password */
#lockScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2b160c,#0d0503);
  z-index:99999;
}
.lock-box{
  background:rgba(255,190,120,.15);
  padding:30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,180,90,.45);
  width:280px;
  box-sizing:border-box; 
}
.pass-wrap{
  position:relative;
}
.pass-wrap input{
  width:100%;
  padding:12px 40px 12px 12px;
  border-radius:12px;
  border:1px solid #ffcc88;
  background:#1a0f0a;
  color:#ffe8be;
  box-sizing:border-box;
}
.pass-wrap span{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* hero */
.hero{
  text-align:center;
  padding:30px;
}
.title{
  font-family:'Allura';
  font-size:60px;
  color:#ffb703;
  text-shadow:0 0 20px rgba(255,180,60,.6);
}
.subtitle{
  letter-spacing:3px;
}

/* gallery */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  padding:20px;
}
.card{
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
}
.card img{
  width:100%;
}
.caption{
  text-align:center;
  padding:10px;
}

/* message */
.msg-box{
  margin:20px auto;
  width:90%;
  padding:20px;
  border-radius:20px;
  background:rgba(255,190,120,.1);
  text-align:center;
}

/* controls */
#topControls{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.controlBox{
  background:#ffb703;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
}

/* spark */
.spark{
  position:absolute;
  width:6px;
  height:6px;
  background:#ffd27d;
  border-radius:50%;
  animation:spark 4s linear;
}
@keyframes spark{
  from{transform:translateY(100vh)}
  to{transform:translateY(-20vh);opacity:0}
}

#sparkLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
}

/* flame */
#flame{
  position:fixed;
  width:12px;
  height:12px;
  background:orange;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
}

.enter-btn{
  margin-top:18px;
  padding:12px 28px;
  border:none;
  border-radius:30px;

  background:linear-gradient(145deg,#ffb703,#ff8c42);
  color:#3b1f00;

  font-weight:500;
  font-size:15px;
  cursor:pointer;

  box-shadow:
    0 6px 20px rgba(255,180,60,.45),
    0 0 15px rgba(255,140,40,.35);

  transition:all .3s ease;
}

/* hover glow */
.enter-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 10px 25px rgba(255,180,60,.6),
    0 0 25px rgba(255,140,40,.5);
}

/* click effect */
.enter-btn:active{
  transform:scale(.96);
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="lockScreen">
  <div class="lock-box">
    <h3>Private Candlelight</h3>

    <div class="pass-wrap">
      <input id="passInput" type="password" placeholder="Enter password">
      <span onclick="togglePass()">👁️</span>
    </div>

    <button onclick="checkPassword()" class="enter-btn">
  Enter 🕯️
</button>

    <div style="
  margin-top:16px;
  line-height:1.6;
  padding:10px;
  border-radius:12px;
  background:rgba(255,180,90,0.08);
">
  
  <p style="
    font-size:14px;
    opacity:0.85;
    margin:0;
  ">
    ✨ This is a Demo Page
  </p>

  <p style="
    font-size:15px;
    font-weight:500;
    margin:4px 0 0 0;
    color:#ffd27d;
  ">
    🔑 Password: <b>123</b>
  </p>

</div>
    <p id="err" style="display:none;color:red;">Wrong</p>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1 class="title">Candlelight Moments</h1>
  <p class="subtitle">Some memories glow quietly</p>
</div>

<!-- GALLERY TITLE -->
<h2 style="
  text-align:center;
  font-family:'Allura',cursive;
  font-size:42px;
  margin-top:30px;
">
  Moments by the flame
</h2>

<!-- GALLERY -->
<div class="grid" id="grid"></div>

<!-- MESSAGE TITLE -->
<h2 style="
  text-align:center;
  font-family:'Allura',cursive;
  font-size:42px;
  margin-top:40px;
">
  Leave a little feeling here
</h2>

<!-- MESSAGE -->
<div class="msg-box" id="msg"></div>

<!-- CONTROLS -->
<div id="topControls">
  <div class="controlBox" id="musicBtn">🎶 Music</div>
  <div class="controlBox" id="sparkBtn">✨ Sparkles</div>
</div>

<audio id="audio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<div id="sparkLayer"></div>
<div id="flame"></div>

<script>

/* PASSWORD */
function checkPassword(){
  if(passInput.value==="123"){
    lockScreen.style.display="none";
  }else err.style.display="block";
}
function togglePass(){
  passInput.type=passInput.type==="password"?"text":"password";
}

/* DATA */
let data=[
  {url:"https://images.unsplash.com/photo-1519681393784-d120267933ba",cap:"Memory 1"},
  {url:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",cap:"Memory 2"}
];

data.forEach(i=>{
  let c=document.createElement("div");
  c.className="card";
  c.innerHTML=`<img src="${i.url}"><div class="caption">${i.cap}</div>`;
  grid.appendChild(c);
});

msg.innerHTML="💌 You are my calm place<br><br>💌 Moments glow forever";

/* MUSIC */
let playing=false;
musicBtn.onclick=()=>{
  playing=!playing;
  if(playing){audio.play();musicBtn.innerText="⏸ Music";}
  else{audio.pause();musicBtn.innerText="🎶 Music";}
};

/* SPARKLES */
let on=false,inter;
sparkBtn.onclick=()=>{
  on=!on;
  if(on){
    inter=setInterval(()=>{
      let s=document.createElement("div");
      s.className="spark";
      s.style.left=Math.random()*100+"vw";
      sparkLayer.appendChild(s);
      setTimeout(()=>s.remove(),4000);
    },300);
  }else clearInterval(inter);
};

/* FLAME */
document.addEventListener("mousemove",e=>{
  flame.style.left=e.clientX+"px";
  flame.style.top=e.clientY+"px";
});
</script>

</body>
</html>
