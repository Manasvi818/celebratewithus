<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Always Together — Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #fff7f2;
  text-align: center;
}

/* TITLE */
.title {
  font-family: "Great Vibes", cursive;
  font-size: 48px;
  color: #f2a67f;
  margin-top: 20px;
}

.subtitle {
  font-family: "Playfair Display";
  color: #6a4a3c;
  margin-bottom: 20px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.card img {
  width: 100%;
  border-radius: 12px;
  cursor: pointer;
}

.caption {
  font-family: "Playfair Display";
  font-size: 14px;
  margin: 6px 0;
}

/* BUTTON */
.btn {
  background: #ff9bb3;
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  color: white;
  cursor: pointer;
}

/* MESSAGE */
.note {
  background: #fff6fa;
  border-radius: 14px;
  padding: 14px;
  margin: 10px;
  font-family: "Playfair Display";
}

/* ZOOM */
#zoomOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  justify-content: center;
  align-items: center;
}

#zoomImg {
  max-width: 90%;
  border-radius: 16px;
}
</style>
</head>

<body>

<h1 class="title">Always Together</h1>
<p class="subtitle">A collection of cherished moments</p>

<h2>Memory Lane</h2>

<div class="grid">

  <div class="card">
    <img src="https://picsum.photos/300?1" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise </button>
    <p class="caption">That perfect smile moment 💛</p>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300?2" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise </button>
    <p class="caption">Laughing like there's no tomorrow 😂</p>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300?3" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise </button>
    <p class="caption">Pure happiness captured 📸</p>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300?4" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise </button>
    <p class="caption">Forever kind of moments 💖</p>
  </div>

</div>

<h2>Love Notes</h2>

<div class="note">You are the best part of every memory ❤️</div>
<div class="note">These moments will always stay with us ✨</div>

<!-- ZOOM -->
<div id="zoomOverlay" onclick="this.style.display='none'">
  <img id="zoomImg">
</div>

<script>
function zoom(src){
  document.getElementById("zoomImg").src = src;
  document.getElementById("zoomOverlay").style.display = "flex";
}

const messages = [
  "You are the star of every moment 💫",
  "This memory = forever ❤️",
  "Pure happiness 💛",
  "Too cute 😭"
];

function surprise(){
  alert(messages[Math.floor(Math.random()*messages.length)]);
}
</script>

</body>
</html>
