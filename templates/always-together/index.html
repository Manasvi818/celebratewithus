<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Always Together — Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#fff7f2;
  text-align:center;
}

/* PASSWORD */
#passwordOverlay{
  position:fixed;
  inset:0;
  background:#ffd6e8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#passwordOverlay input{
  padding:10px;
  border-radius:10px;
  border:1px solid #d39;
}

#passwordOverlay button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff7b9a;
  color:white;
}

.hint{
  margin-top:10px;
  font-size:14px;
  color:#444;
}

/* TITLE */
.title{
  font-family:"Great Vibes";
  font-size:48px;
  color:#f2a67f;
}

.subtitle{
  font-family:"Playfair Display";
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  padding:8px;
  border-radius:12px;
}

.card img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

.btn{
  background:#ff9bb3;
  border:none;
  padding:6px 12px;
  border-radius:20px;
  color:white;
  cursor:pointer;
}

/* ZOOM */
#zoomOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

#zoomImg{
  max-width:90%;
  border-radius:10px;
}

/* DECOR BUTTON */
.decorBtn{
  position:fixed;
  top:10px;
  right:10px;
  background:#ff9bb3;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  color:white;
}

/* MUSIC BUTTON */
.musicBtn{
  position:fixed;
  top:60px;
  right:10px;
  background:#ff9bb3;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  color:white;
}

/* DECOR OVERLAY */
#decorOverlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.4);
}

#decorCard{
  background:white;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">
  <h2>Enter Password</h2>
  <input id="pass" type="password" placeholder="Password">
  <button onclick="unlock()">Unlock</button>
  <div class="hint">Demo Password: 123</div>
</div>

<!-- BUTTONS -->
<button class="decorBtn" onclick="openDecor()">Decor</button>
<button class="musicBtn" onclick="toggleMusic()">Music Off</button>

<h1 class="title">Always Together</h1>
<p class="subtitle">A collection of cherished moments</p>

<h2>Memory Lane</h2>

<div class="grid">
  <div class="card">
    <img src="https://picsum.photos/300?1" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise ✨</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300?2" onclick="zoom(this.src)">
    <button class="btn" onclick="surprise()">Surprise ✨</button>
  </div>
</div>

<!-- ZOOM -->
<div id="zoomOverlay" onclick="this.style.display='none'">
  <img id="zoomImg">
</div>

<!-- DECOR -->
<div id="decorOverlay" onclick="closeDecor(event)">
  <div id="decorCard">
    <h3>Decorations</h3>
    <button onclick="toggleNight()">Toggle Night</button>
  </div>
</div>

<script>

/* PASSWORD */
function unlock(){
  const val = document.getElementById("pass").value;
  if(val === "123"){
    document.getElementById("passwordOverlay").style.display="none";
  } else {
    alert("Wrong password");
  }
}

/* ZOOM */
function zoom(src){
  document.getElementById("zoomImg").src = src;
  document.getElementById("zoomOverlay").style.display = "flex";
}

/* SURPRISE */
function surprise(){
  alert("This moment is special 💖");
}

/* DECOR */
function openDecor(){
  document.getElementById("decorOverlay").style.display="flex";
}

function closeDecor(e){
  if(e.target.id==="decorOverlay"){
    document.getElementById("decorOverlay").style.display="none";
  }
}

function toggleNight(){
  document.body.style.background = 
    document.body.style.background === "black" ? "#fff7f2" : "black";
}

/* FAKE MUSIC */
let musicOn = false;

function toggleMusic(){
  musicOn = !musicOn;

  const btn = document.querySelector(".musicBtn");

  if(musicOn){
    btn.innerText = "Music On";
  } else {
    btn.innerText = "Music Off";
  }
}
</script>

</body>
</html>
