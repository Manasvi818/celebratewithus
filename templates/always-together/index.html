<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Always Together — Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#fff7f2;
}

body.night{
  background:#191113;
  color:#ffe4ec;
}

/* PASSWORD */
#passwordOverlay{
  position:fixed;
  inset:0;
  background:#ffd6e8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#passwordOverlay input{
  padding:12px;
  border-radius:10px;
  border:1px solid #d39;
}
#passwordOverlay button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff7b9a;
  color:white;
}
.hint{margin-top:10px;font-size:14px}

/* HEADER */
.title{
  font-family:"Great Vibes";
  font-size:50px;
  text-align:center;
  color:#f2a67f;
}
.subtitle{
  text-align:center;
  font-family:"Playfair Display";
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.card{
  background:white;
  padding:8px;
  border-radius:12px;
}
.card img{
  width:100%;
  border-radius:10px;
}
.tapBtn{
  margin-top:6px;
  background:#ff9bb3;
  border:none;
  padding:6px 12px;
  border-radius:20px;
  color:white;
}
.caption{
  font-size:14px;
  font-family:"Playfair Display";
}

#decorCard{
  background:white;
  width:280px;
  padding:18px;
  border-radius:16px;
  font-family:"Playfair Display";
}

.btnSmall{
  background:#ff9bb3;
  border:none;
  border-radius:10px;
  padding:8px 14px;
  margin:6px 4px;
  color:white;
}

.sectionTitle{
  text-align:center;
  font-family:"Great Vibes", cursive;
  font-size:52px;
  margin:18px 0 12px;
  color:#f2a67f;
  letter-spacing:1px;
  font-weight:400;
}

/* MESSAGE */
.note{
  background:#fff6fa;
  margin:10px;
  padding:14px;
  border-radius:12px;
  font-family:"Playfair Display";
}

/* ZOOM */
#zoomOverlay{
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,.7);
  justify-content:center;
  align-items:center;
}
#zoomImg{max-width:90%}

/* DECOR BUTTON */
.decorBtn{
  position:fixed;
  top:10px;
  right:10px;
  background:#ff9bb3;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  color:white;
}

/* MUSIC BUTTON */
.musicBtn{
  position:fixed;
  top:60px;
  right:10px;
  background:#ff9bb3;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  color:white;
}

/* DECOR */
#decorOverlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.4);
}
#decorCard{
  background:white;
  padding:20px;
  border-radius:10px;
}

/* SURPRISE */
#msgOverlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.5);
}
#msgBox{
  background:white;
  padding:20px;
  border-radius:10px;
}

/* NIGHT MODE FIXES */
body.night .card{
  background:#2a1b1f;
  color:#ffe4ec;
}

body.night .note{
  background:#2a1b1f;
  color:#ffe4ec;
}

body.night #decorCard{
  background:#2a1b1f;
  color:#ffe4ec;
}

body.night #msgBox{
  background:#2a1b1f;
  color:#ffe4ec;
}

body.night .caption{
  color:#ffd6e8;
}

body.night .btnSmall,
body.night .tapBtn,
body.night .decorBtn,
body.night .musicBtn{
  background:#ff7b9a;
  color:white;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">
  <h2>Enter Password</h2>
  <input id="pass" type="password">
  <button onclick="unlock()">Unlock</button>
  <div class="hint">Demo Password: 123</div>
</div>

<!-- BUTTONS -->
<button class="decorBtn" onclick="openDecor()">Decor</button>
<button class="musicBtn" onclick="toggleMusic()">Music Off</button>

<h1 class="title">Always Together</h1>
<p class="subtitle">A collection of cherished moments</p>

<h2 class="sectionTitle">Memory Lane</h2>

<div class="grid" id="grid"></div>

<h2 class="sectionTitle">Love Notes</h2>
<div id="messages"></div>

<!-- ZOOM -->
<div id="zoomOverlay" onclick="this.style.display='none'">
  <img id="zoomImg">
</div>

<!-- DECOR -->
<div id="decorOverlay">
  <div id="decorCard">
    <h3>Decorations</h3>

    <p>Mode</p>
    <button class="btnSmall" onclick="setDay()">Day</button>
    <button class="btnSmall" onclick="setNight()">Night</button>

    <p>Decoration / sec</p>
    <input id="rate" type="range" min="0" max="10" value="3">

    <p>Decoration size</p>
    <input id="size" type="range" min="10" max="80" value="30">

    <p>Burst style</p>
    <select id="burst">
      <option>Hearts</option>
      <option>Sparkles</option>
    </select>

    <button class="btnSmall" style="width:100%" onclick="applyDecor()">Apply</button>
  </div>
</div>

<!-- SURPRISE -->
<div id="msgOverlay">
  <div id="msgBox">
    <p id="msgText"></p>
    <button onclick="closeMsg()">Close</button>
  </div>
</div>

<script>

    function setDay(){
  document.body.classList.remove("night");
}

function setNight(){
  document.body.classList.add("night");
}

let decorInterval;

function applyDecor(){
  const rate = document.getElementById("rate").value;
  const size = document.getElementById("size").value;
  const burst = document.getElementById("burst").value;

  clearInterval(decorInterval);

  decorInterval = setInterval(()=>{
    createParticle(size, burst);
  }, 1000 / (rate || 1));
}

function createParticle(size, type){
  const el = document.createElement("div");

  el.innerText = type === "Hearts" ? "💖" : "✨";

  el.style.position = "fixed";
  el.style.left = Math.random() * window.innerWidth + "px";
  el.style.top = "-20px";
  el.style.fontSize = size + "px";
  el.style.pointerEvents = "none";
  el.style.zIndex = 999;

  document.body.appendChild(el);

  let y = 0;

  const fall = setInterval(()=>{
    y += 3;
    el.style.top = y + "px";

    if(y > window.innerHeight){
      clearInterval(fall);
      el.remove();
    }
  }, 20);
}

/* DEMO DATA */
const images = [
  {url:"https://picsum.photos/400?1", cap:"That perfect smile 💛"},
  {url:"https://picsum.photos/400?2", cap:"Laughing together 😂"},
  {url:"https://picsum.photos/400?3", cap:"Memories forever 📸"},
  {url:"https://picsum.photos/400?4", cap:"Pure happiness 💖"}
];

const notes = [
  "You are the best part of every memory ❤️",
  "These moments will stay forever ✨",
  "Every picture tells our story 💫"
];

const cute = [
  "You are magic ✨",
  "Too cute 😭",
  "Best memory ever 💖"
];

/* PASSWORD */
function unlock(){
  if(pass.value==="123"){
    passwordOverlay.style.display="none";
    render();
  }else alert("Wrong password");
}

/* RENDER */
function render(){
  grid.innerHTML="";
  images.forEach((x,i)=>{
    grid.innerHTML+=`
      <div class="card">
        <img src="${x.url}" onclick="zoom('${x.url}')">
        <button class="tapBtn" onclick="surprise(${i})">Surprise</button>
        <p class="caption">${x.cap}</p>
      </div>
    `;
  });

  notes.forEach(n=>{
    messages.innerHTML+=`<div class="note">${n}</div>`;
  });
}

/* ZOOM */
function zoom(src){
  zoomImg.src=src;
  zoomOverlay.style.display="flex";
}

/* SURPRISE */
function surprise(){
  msgText.innerText=cute[Math.floor(Math.random()*cute.length)];
  msgOverlay.style.display="flex";
}
function closeMsg(){msgOverlay.style.display="none";}

/* DECOR */
function openDecor(){decorOverlay.style.display="flex";}
function closeDecor(e){if(e.target.id==="decorOverlay")decorOverlay.style.display="none";}
function setDay(){
  document.body.classList.remove("night");
}

function setNight(){
  document.body.classList.add("night");
}

function applyDecor(){
  alert("Decor applied ✨");
}

/* FAKE MUSIC */
let audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
audio.loop = true;
function toggleMusic(){
  music=!music;
  document.querySelector(".musicBtn").innerText = music ? "Music On" : "Music Off";
}

decorOverlay.onclick = (e) => {
  if(e.target === decorOverlay){
    decorOverlay.style.display = "none";
  }
};
</script>

</body>
</html>
