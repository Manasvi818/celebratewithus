<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" href="https://celebratewithus.co.in/styles/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg-main:#F6E3C9;
  --peach:#F3C6A8;
  --heart:#E77A73;
  --text-main:#B94E4B;
  --card:#FFF6EF;
  --beige:#EAD2B8;
  --accent:#8C4A3C;
}

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,var(--bg-main),var(--peach));
  color:var(--text-main);
  overflow-x:hidden;
}

.dot-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-1;

background-image:
radial-gradient(circle, rgba(231,122,115,0.25) 5px, transparent 6px);

background-size:120px 120px;
}
/* HERO */

.hero{
padding:30px 20px 40px;
text-align:center;
margin-top:-20px;
}

.title{
font-family:'Allura',cursive;

  font-size:clamp(2.5rem, 8vw, 6rem);

margin-bottom:0;
line-height:1;
color:var(--text-main);
}

@media(max-width:560px){
  .title{ font-size:4.5rem; }
}

.subtitle{
font-family:'Libre Baskerville',serif;
letter-spacing:4px;
font-size:16px;
margin-top:8px;
opacity:.8;
text-transform:uppercase;
}

/* GALLERY */

.gallery{
max-width:1150px;
margin:auto;
padding:10px 20px 30px;
}

.grid{
  display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));

  gap:18px;
}

@media(max-width:600px){
.grid{grid-template-columns:1fr;}
}

.card{
background:var(--card);
border-radius:26px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.1);
transition:.4s;
}

.card:hover{
transform:translateY(-8px);
}

.card img,
.card video{
  width:100%;
  height:auto;
  max-height:320px;
  object-fit:cover;
}

.caption{
padding:18px;
text-align:center;
font-style:italic;
color:var(--text-main);
}

/* MESSAGE BOX */

.message-box{
margin:70px 0;
text-align:center;
}

.pink-msg-box{
width:min(92%,950px);
margin:auto;
padding:50px;
border-radius:32px;
background:linear-gradient(145deg,var(--card),var(--beige));
box-shadow:0 20px 60px rgba(0,0,0,.12);
font-size:18px;
line-height:1.8;
}

/* CONTROLS */

.controlBox{
background:var(--accent);
color:white;
padding:12px 22px;
border-radius:40px;
cursor:pointer;
transition:.3s;
}

.controlBox:hover{
transform:scale(1.1);
}

#topControls{
  position:fixed;
  top:20px;
  right:20px;

  display:flex;
  flex-direction:row;
  gap:10px;

  z-index:9999;

}
@media(max-width:600px){

  body{
    padding:10px;
  }

  .hero{
    padding:20px 10px;
  }

  .pink-msg-box{
    padding:20px;
    font-size:16px;
  }

}

.controlBox{
  background:var(--accent);
  color:white;

  padding:8px 14px;
  border-radius:20px;

  font-size:13px;
  font-weight:500;

  cursor:pointer;
  transition:.3s;

  min-width:auto;
  height:auto;
}
/* PASSWORD SCREEN */

#lockScreen{
position:fixed;
inset:0;
background:linear-gradient(135deg,var(--bg-main),var(--peach));
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.passCard{
padding:30px;
border-radius:22px;
text-align:center;
background:linear-gradient(145deg,var(--card),var(--beige));
color:var(--text-main);
box-shadow:0 25px 70px rgba(0,0,0,.15);
width:420px;
max-width:90%;
}

.passCard h3{
font-family:'Allura',cursive;
font-size:2.8rem;
margin-bottom:10px;
}

.passCard input{
width:100%;
padding:10px;
border-radius:20px;
border:1px solid var(--beige);
margin-top:10px;
}

.passCard button{
margin-top:16px;
padding:10px 22px;
border-radius:30px;
border:none;
background:var(--accent);
color:white;
cursor:pointer;
}

/* FLOATING HEARTS */

.floating-heart{
position:fixed;
bottom:-30px;
font-size:22px;
pointer-events:none;
animation:heartFloat 8s linear forwards;
}

@keyframes heartFloat{
from{transform:translateY(0);opacity:0;}
10%{opacity:1;}
to{transform:translateY(-120vh);opacity:0;}
}

.msg-title{
text-align:center;
font-family:'Allura',cursive;
font-size:3rem;
margin-bottom:25px;
}

.videoBox{
  width:100%;
  margin-bottom:30px;
}

.videoBox video{
  width:100%;
  aspect-ratio:16/9;
  border-radius:20px;
  object-fit:cover;
}

.site-footer{
  text-align:center;
  margin-top:40px;
  padding:18px;
  font-size:14px;
  color:#B94E4B;
}

.surprise-btn{
  margin:12px auto 6px;
  display:block;

  background:var(--accent);
  color:white;

  padding:10px 18px;
  border:none;
  border-radius:25px;

  font-size:14px;
  font-weight:500;

  cursor:pointer;
  transition:0.3s;

  width:fit-content;
  min-height:36px;
}

.surprise-btn:hover{
  transform:scale(1.08);
  background:#6e3a2f;
}

.card{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.memory{
  padding:10px 16px;
  margin:10px 14px 16px;

  font-size:14px;
  line-height:1.5;

  background:rgba(0,0,0,0.03);
  border-radius:12px;

  color:var(--text-main);
}

/* SURPRISE POPUP */

.surprise-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:999999;
  backdrop-filter:blur(5px);
}

.surprise-box{
  width:min(90%,420px);

  background:linear-gradient(145deg,var(--card),var(--beige));

  border-radius:30px;
  padding:35px 28px;

  text-align:center;

  box-shadow:0 20px 60px rgba(0,0,0,.18);

  animation:popupShow .35s ease;
}

.popup-heart{
  font-size:42px;
  margin-bottom:10px;
}

.surprise-box h2{
  font-family:'Allura',cursive;
  font-size:3rem;
  margin:0 0 10px;
  color:var(--text-main);
}

.surprise-box p{
  font-size:16px;
  line-height:1.7;
  color:var(--text-main);
}

.close-popup{
  position:absolute;
  margin-top:-10px;
  margin-left:160px;

  cursor:pointer;
  font-size:18px;
  color:var(--accent);
}

@keyframes popupShow{
  from{
    transform:scale(.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}
</style>
</head>

<body>
<div class="dot-bg"></div>
<section class="hero">
<h1 class="title">Sweet Affection</h1>
<h2 class="subtitle">You are my everything</h2>
</section>

<div id="lockScreen">

<div class="passCard">

<h3>This is a Demo Page</h3>
<p style="margin:10px 0;font-size:14px;">
Password: <b>123</b>
</p>

<input id="passInput" type="password" placeholder="Enter password">

<button onclick="unlock()">Enter</button>

<p id="wrongPass" style="display:none;color:#ff7b7b;">
Wrong password
</p>

</div>
</div>

<section class="gallery">

<h2 class="msg-title">Our Lovely Moments</h2>

<div id="videoContainer"></div>
<div class="grid" id="imageGrid"></div>

</section>

<section class="message-box">

<h2 class="msg-title">A message for you</h2>

<div id="viewerMessage" class="pink-msg-box">
This is a demo message 💛  
Your memories and words will appear here.
</div>

</section>

<div id="topControls">

<div class="controlBox" id="musicToggle">
 Music
</div>

<div class="controlBox" id="sparkleToggle">
 Hearts
</div>

</div>
<div id="imgZoomOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;">
  <div style="text-align:center;">
    <img id="zoomImg" style="max-width:90%;max-height:80vh;border-radius:12px;">
    <p id="zoomCaption" style="color:white;"></p>
  </div>
</div>
<script>
function optimizeCloudinaryUrl(url, width = 500) {
  if (!url || !url.includes("res.cloudinary.com")) return url;

  if (url.includes("/upload/f_auto")) return url;

  return url.replace(
    "/upload/",
    `/upload/f_auto,q_auto,w_${width}/`
  );
}

const projectId = window.location.pathname.split("/").pop();

let data = [];
let messages = "";
let music = "";
let password = "";
let PASS = "";
let isLoaded = false;

/* PASSWORD */

function unlock(){

  if(!isLoaded){
    alert("⏳ Wait...");
    return;
  }

  const entered = document.getElementById("passInput").value.trim();

  if(entered === PASS){

    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("wrongPass").style.display = "none";

    if(music){
        setupMusic();
    }

  } else {
    document.getElementById("wrongPass").style.display = "block";
  }
}

function loadViewerData(){

  data = [
   {
    type: "image",
    url: "https://images.unsplash.com/photo-1519741497674-611481863552?w=800&auto=format",
    caption: "A golden evening together",
    memory: "One of those moments that stayed forever."
  },
  {
    type: "image",
    url: "https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=800&auto=format",
    caption: "Soft silence",
    memory: "Where words weren’t needed."
  },
   {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824069/romantic2_idvlns.jpg", 
    caption:"The moment everything changed",
    memory: "Where love feels like a fairytale."
  },
  {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824067/romantic3_qzczak.jpg",
     caption:"Every detail planned… just for you.",
     memory: "Us, being us… and that’s enough."
   },
  {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824030/romantic5_win3kt.jpg", 
    caption:"Built this moment, just to see you smile",
    memory: "Just us, and this moment."
  },
  {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824028/romantic6_bvw2yd.jpg", 
    caption:"You’re my favorite reason to smile.",
    memory: "And I’ll hold your hand through it all."
  },
  {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824065/romantic4_fppicj.jpg",
     caption:"With you, every sunset feels perfect.",
     memory: "Every laugh feels better with you."
   },
  {
    type: "image",
    url:"https://res.cloudinary.com/di8n4lsjz/image/upload/v1777824072/romantic1_szxefv.jpg", 
    caption:"It’s always been you.",
    memory: "Forever feels right here."
  },
    {
      type:"video",
      url:"https://res.cloudinary.com/di8n4lsjz/video/upload/v1774204952/warm_bonds/qlfo4s9mrshe1lejpgxk.mp4",
      caption:"A special video 🎥"
    }
  ];

  messages = "You are my favorite person 💖\n---\nEvery moment with you matters ✨";

  music = "https://res.cloudinary.com/di8n4lsjz/video/upload/v1769024733/Falling_Slowly_czfydq.mp3";

  PASS = "123";
  isLoaded = true;

  render();
  loadMessages();
  setupMusic();
}

function render(){

  const videoContainer = document.getElementById("videoContainer");
  const imageGrid = document.getElementById("imageGrid");

  videoContainer.innerHTML = "";
  imageGrid.innerHTML = "";

  data.forEach(item=>{
    if(item.type === "video"){
      videoContainer.innerHTML += `
        <div class="videoBox">
          <video src="${optimizeCloudinaryUrl(item.url,800)}" controls></video>
          <div class="caption">${item.caption || ""}</div>
        </div>
      `;
    }
  });

  data.forEach((item,i)=>{
    if(item.type !== "video"){
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
  <img src="${optimizeCloudinaryUrl(item.url,400)}" onclick="openZoom('${item.url}', \`${item.caption || ""}\`)">

  <button class="surprise-btn" onclick="showRandom(${i})">✨ Surprise</button>

  <div class="caption">${item.caption || ""}</div>

  ${item.memory ? `<div class="memory">${item.memory}</div>` : ""}
`;

      imageGrid.appendChild(card);
    }
  });

}

function openZoom(src, cap){
  document.getElementById("zoomImg").src = src;
  document.getElementById("zoomCaption").innerText = cap;
  document.getElementById("imgZoomOverlay").style.display = "flex";
}

document.getElementById("imgZoomOverlay").onclick = (e)=>{
  if(e.target.id === "imgZoomOverlay"){
    e.currentTarget.style.display = "none";
  }
};

const cuteMessages = [
  "You are the star of every moment 💫",
  "This smile deserves its own fanbase 😍",
  "Your vibe is goals ✨",
  "You glow differently when you're happy ✨",
  "This moment = forever memory 💖"
];

function showRandom(){

  const randomMsg =
    cuteMessages[Math.floor(Math.random()*cuteMessages.length)];

  document.getElementById("surpriseText").innerText = randomMsg;

  document.getElementById("surprisePopup").style.display = "flex";
}

function closeSurprise(){
  document.getElementById("surprisePopup").style.display = "none";
}

/* MUSIC */

let bgAudio = null;

function setupMusic(){
  if(!music) return;

  bgAudio = new Audio(music);
  bgAudio.loop = true;
  bgAudio.volume = 0.6;
}


let playing=false;

const musicToggle=document.getElementById("musicToggle");

function startMusic(){

if(!music) return;

if(!bgAudio){
setupMusic();
}

bgAudio.play().catch(()=>{});
musicToggle.innerText = "⏸ Music";

}

musicToggle.onclick = ()=>{

  if(!music){
    musicToggle.innerText = "No Music";
    return;
  }

  if(!bgAudio){
    setupMusic();
  }

  if(bgAudio.paused){
    bgAudio.play();
    musicToggle.innerText = "⏸ Music";
  } else {
    bgAudio.pause();
    musicToggle.innerText = "🎶 Music";
  }

};

/* 💖 HEART TOGGLE */

let heartsOn = true;
let heartInterval;

const heartBtn = document.getElementById("sparkleToggle");

function startHearts(){
heartInterval = setInterval(()=>{
const heart=document.createElement("div");
heart.className="floating-heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),8000);
},900);
}

function stopHearts(){
clearInterval(heartInterval);
}

heartBtn.onclick=()=>{

heartsOn = !heartsOn;

if(heartsOn){
heartBtn.innerText=" Hearts ON";
startHearts();
}
else{
heartBtn.innerText=" Hearts OFF";
stopHearts();
}

};

/* start hearts by default */
startHearts();

/* LOAD GALLERY */

const grid=document.querySelector(".grid");
const viewerMessage=document.getElementById("viewerMessage");



function loadMessages(){
  const viewerMessage = document.getElementById("viewerMessage");

  if(!messages.trim()){
    viewerMessage.innerHTML = "No messages yet ❤️";
    return;
  }

  viewerMessage.innerHTML = messages
    .split("\n---\n")
    .map(m => `💌 ${m}`)
    .join("<br><br>");
}

document.addEventListener("DOMContentLoaded", ()=>{
  loadViewerData();
});



</script>
<footer class="site-footer">
  <p>© CelebrateWithUs.web • Crafted with 💛</p>
</footer>

<!-- SWEET AFFECTION SURPRISE POPUP -->

<div id="surprisePopup" class="surprise-popup">

  <div class="surprise-box">

    <span class="close-popup" onclick="closeSurprise()">✕</span>

    <div class="popup-heart">💖</div>

    <h2>Sweet Surprise</h2>

    <p id="surpriseText"></p>

  </div>

</div>
</body>
</html>
