<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blush Love Demo 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* KEEPING YOUR ORIGINAL STYLE (unchanged) */
body {
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#FF8FAB,#FFB7A5);
}

/* --- PASSWORD --- */
#passwordOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:linear-gradient(135deg,#ff8fab,#ffb7a5);
  z-index:9999;
  color:white;
  font-family:'Playfair Display';
}

input{
  padding:14px;
  border:none;
  border-radius:14px;
  text-align:center;
}

button{
  margin-top:15px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">

  <h1 style="font-size:46px;">Blush Love</h1>

  <p>Enter the secret password</p>

  <!-- ✅ PASSWORD SHOWN -->
  <p style="opacity:0.9;">Password: <b>123</b></p>

  <input id="viewerPass" type="password" placeholder="Password">

  <button onclick="unlockViewer()">Unlock</button>

  <p id="wrongPass" style="display:none;color:red;">
    Wrong password
  </p>

</div>

<!-- YOUR PAGE CONTENT -->
<h1 style="text-align:center;margin-top:40px;">Blush Love</h1>

<div style="
position:fixed;
top:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
z-index:999;
">

  <button onclick="toggleTheme()" style="
  background:#ff8fab;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  ">
  Theme 
  </button>

  <button onclick="toggleMusic()" style="
  background:#ff8fab;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  ">
  Music 
  </button>

  <button onclick="confetti()" style="
  background:#ff8fab;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  ">
  Love 
  </button>

</div>

<div id="gallery" style="padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px;"></div>

<!-- MESSAGE SECTION -->
<div style="text-align:center;margin-top:30px;">

  <h2 style="font-family:'Great Vibes'; color:#b34b6a;">
    Leave a little feeling 💌
  </h2>

  <div id="viewerMessage" style="
    background:#ffd6e8;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    width:90%;
    max-width:500px;
  ">
    No messages yet 💗
  </div>

  <textarea id="msgInput" placeholder="Write your message 💌"></textarea>

  <br>

  <button onclick="addMessage()">Send Message</button>

</div>

<script>

/* ================================
   ✅ PASSWORD FIXED HERE
================================ */
let PASS = "123";

/* DEMO DATA (you can replace with backend data) */
let data = [
  {url:"https://picsum.photos/400?1", caption:"Memory 1"},
  {url:"https://picsum.photos/400?2", caption:"Memory 2"}
];

/* ================================
   PASSWORD FUNCTION
================================ */
function unlockViewer(){
  const input = document.getElementById("viewerPass").value;

  if(input === PASS){
    document.getElementById("passwordOverlay").style.display = "none";
  } else {
    document.getElementById("wrongPass").style.display = "block";
  }
}

/* ================================
   RENDER
================================ */
function render(){
  const gallery = document.getElementById("gallery");

  data.forEach(x=>{
    const div = document.createElement("div");

    div.innerHTML = `
      <img src="${x.url}" style="width:100%;border-radius:12px;">
      <p style="text-align:center;">${x.caption}</p>
    `;

    gallery.appendChild(div);
  });
}

render();


let messages = "";

function addMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if(!text) return;

  if(messages){
    messages += "\n" + text;
  } else {
    messages = text;
  }

  input.value = "";
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById("viewerMessage");

  if(!messages){
    box.innerText = "No messages yet 💗";
    return;
  }

  box.innerHTML = messages.split("\n")
    .map(m => `<div style="margin:5px 0;">${m}</div>`)
    .join("");
}

function toggleTheme(){
  const body = document.body;

  if(body.style.background.includes("255, 183")){
    body.style.background = "linear-gradient(135deg,#ff5c8a,#ffd6e8)";
  } else {
    body.style.background = "linear-gradient(135deg,#FF8FAB,#FFB7A5)";
  }
}

function confetti(){
  for(let i=0;i<20;i++){
    const c=document.createElement("div");
    c.style.position="fixed";
    c.style.top="-10px";
    c.style.left=Math.random()*100+"vw";
    c.style.width="10px";
    c.style.height="10px";
    c.style.background="pink";

    c.style.animation="fall 3s linear forwards";

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),3000);
  }
}
</script>


</body>
</html>
