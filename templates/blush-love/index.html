<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blush Love Demo </title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#FF8FAB,#FFB7A5);
}

/* PASSWORD */
#passwordOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:linear-gradient(135deg,#ff8fab,#ffb7a5);
  z-index:9999;
  color:white;
  font-family:'Playfair Display';
}

/* HERO */
.hero{
  text-align:center;
  padding:30px 20px 10px;
}

.title{
  font-family:'Playfair Display';
  font-size:60px;
  color:#b34b6a;
  margin:0;
}

.subtitle{
  font-family:'Playfair Display';
  color:#b34b6a;
}

/* BUTTONS */
.controls{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.controls button{
  background:#ff8fab;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
}

/* GALLERY */
.gallery{
  padding:20px;
}

.gallery h2{
  text-align:center;
  font-family:'Great Vibes';
  color:#b34b6a;
  font-size:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.caption{
  text-align:center;
  padding:10px;
}

/* MESSAGE */
.message-box{
  text-align:center;
  margin-top:30px;
}

#viewerMessage{
  background:#ffd6e8;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:500px;
}

textarea{
  width:90%;
  max-width:500px;
  padding:12px;
  border-radius:12px;
  border:none;
}

.toggle{
  background:#ff8fab;
  color:white;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  text-align:center;
}

.img-msg{
  margin:10px auto;
  display:block;
  background:#FF8FAB;
  color:white;
  border:none;
  padding:6px 16px;
  border-radius:20px;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">
  <h1>Blush Love</h1>
  <p>Password: <b>123</b></p>
  <input id="viewerPass" type="password">
  <button onclick="unlockViewer()">Unlock</button>
  <p id="wrongPass" style="display:none;">Wrong password</p>
</div>

<!-- HERO -->
<div class="hero">
  <h1 class="title">Blush Love</h1>
  <p class="subtitle">Some feelings don’t need words. They just need a place.</p>
</div>

<!-- BUTTONS -->
<div style="
position:fixed;
top:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
z-index:999;
">

<div class="toggle" onclick="openTheme()">Theme</div>

<div class="toggle" onclick="toggleConfetti()">
Confetti: <span id="confettiState">OFF</span>
</div>

<div class="toggle" onclick="openMusic()">Music</div>

</div>

<!-- GALLERY -->
<div class="gallery">
  <h2>Moments that blush </h2>
  <div class="grid" id="gallery"></div>
</div>

<!-- MESSAGE -->
<div class="message-box">
  <h2 style="font-family:'Great Vibes';color:#b34b6a;">
    Leave a little feeling 
  </h2>

  <div id="viewerMessage"></div>

  <textarea id="msgInput" placeholder="Write your message 💌"></textarea><br><br>
  <button onclick="addMessage()">Send Message</button>
</div>

<script>

/* PASSWORD */
let PASS="123";

function unlockViewer(){
  const val=document.getElementById("viewerPass").value;

  if(val===PASS){
    document.getElementById("passwordOverlay").style.display="none";
  }else{
    document.getElementById("wrongPass").style.display="block";
  }
}

/* GALLERY DATA */
const data=[
  {url:"https://picsum.photos/400?1",caption:"This moment felt like magic 💖"},
  {url:"https://picsum.photos/400?2",caption:"Smiles we’ll remember forever ✨"},
  {url:"https://picsum.photos/400?3",caption:"A memory frozen in time 📸"},
  {url:"https://picsum.photos/400?4",caption:"Happiness lives here 💗"}
];

function render(){
  const gallery=document.getElementById("gallery");

  data.forEach(x=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML = `
  <img src="${x.url}">
  <button class="img-msg">tap gently</button>
  <div class="caption">${x.caption}</div>
`;

    gallery.appendChild(div);
  });
}

render();

/* MESSAGE (PRE-FILLED LIKE VIEWER) */
let messages = `
"Pyaar perfect nahi hai... par tere saath perfect feel hota hai."
---
"Tere saath sab kuch thoda sa Gulabi lagta hai..."
---
"Kabhi hasi, kabhi confusion... par tu ho toh sab sahi hai."
`;

function renderMessages(){
  const box = document.getElementById("viewerMessage");

  box.innerHTML = messages.split("\n---\n")
    .map(m => `
      <div style="
        background:white;
        padding:14px;
        border-radius:20px;
        margin-bottom:12px;
        color:#ff8fab;
      ">
        ${m}
      </div>
    `).join("");
}

renderMessages();

function addMessage(){
  const input=document.getElementById("msgInput");
  const text=input.value.trim();

  if(!text) return;

  messages+="\n---\n"+text;
  input.value="";
  renderMessages();
}

let confettiOn = false;

function toggleConfetti(){
  confettiOn = !confettiOn;

  document.getElementById("confettiState").innerText =
    confettiOn ? "ON" : "OFF";
}

/* THEME (FIXED ✅) */
let dark=false;


  let themeIndex = 0;

const themes = [
  {start:"#FF8FAB", end:"#FFB7A5"},
  {start:"#FF5C8A", end:"#FFD6E8"},
  {start:"#FF8FAB", end:"#FFFDF9"}
];

function setTheme(start, end){
  document.body.style.background = `linear-gradient(135deg,${start},${end})`;

  document.querySelectorAll(".title, .subtitle, .gallery h2")
    .forEach(el => el.style.color = start);
}

function openTheme(){
  themeIndex = (themeIndex + 1) % themes.length;
  setTheme(themes[themeIndex].start, themes[themeIndex].end);
}

/* MUSIC (DEMO ONLY — NO REAL SOUND) */




function openMusic(){
  document.getElementById("musicPanel").style.display="flex";
}

function closeMusic(){
  document.getElementById("musicPanel").style.display="none";
}

let playing=false;

function toggleMusic(){
  playing=!playing;
  alert(playing ? "Music Playing 🎵" : "Music Paused ⏸");
}
</script>
<div id="musicPanel" style="
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
display:none;
justify-content:center;
align-items:center;
">

<div style="
background:white;
padding:20px;
border-radius:20px;
text-align:center;
">

<h3>Background Music 🎶</h3>

<button onclick="toggleMusic()">▶ Play Music</button>
<br><br>
<button onclick="closeMusic()">Close</button>

</div>
</div>
</body>
</html>
