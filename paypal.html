<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal Payment</title>

  <script src="https://www.paypal.com/sdk/js?client-id=AWwHV5kZpZ6qwAM3BReNPv7-GXSB5xE4iOwgetjDA8F6aVnaCuQo8Wr2dJBNZSLz6Wt8NNKj8Yp9Lcc1&currency=USD"></script>

  <style>
   *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  font-family:Arial,sans-serif;

  background:
  radial-gradient(circle at top left,#ede9fe,#fdf2f8);
}

/* CARD */
.paypal-card{
  width:100%;
  max-width:500px;

  background:white;

  padding:40px 30px;

  border-radius:24px;

  box-shadow:0 15px 40px rgba(0,0,0,0.12);

  text-align:center;

  animation:fadeIn 0.5s ease;
}

/* TITLE */
h1{
  color:#7c3aed;

  font-size:clamp(28px,5vw,40px);

  margin-bottom:12px;
}

/* TEXT */
p{
  color:#555;

  font-size:clamp(14px,2vw,17px);

  line-height:1.6;

  margin-bottom:30px;
}

/* PAYPAL CONTAINER */
#paypal-button-container{
  width:100%;
}

/* ANIMATION */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* TABLET */
@media (max-width:768px){

  .paypal-card{
    padding:35px 25px;
    border-radius:20px;
  }

}

/* MOBILE */
@media (max-width:480px){

  body{
    padding:15px;
  }

  .paypal-card{
    padding:28px 20px;
    border-radius:18px;
  }

  h1{
    margin-bottom:10px;
  }

  p{
    margin-bottom:24px;
  }

}
  </style>
</head>

<body>

  <div class="paypal-card">

    <h1>Pay with PayPal</h1>

    <p>Secure international payment</p>

    <div id="paypal-button-container"></div>

  </div>

  <script>
    paypal.Buttons({

      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: '2.50'
            }
          }]
        });
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {

          alert("Payment Successful!");

          window.location.href = "success.html";

        });
      }

    }).render('#paypal-button-container');
  </script>

</body>
</html>
