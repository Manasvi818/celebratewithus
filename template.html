<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templates</title>

  <link rel="stylesheet" href="../styles/main.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #e6fff7, #f0f9ff);
      text-align: center;
    }

    h1 {
      margin: 20px 0;
      color: #5f9ea0;
    }

    .templates-container {
      padding: 20px;
    }

    .template-card {
      position: relative;
      margin: 20px auto;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
    }

    .template-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      filter: brightness(0.7);
    }

    .template-card h3 {
      position: absolute;
      bottom: 15px;
      left: 15px;
      color: white;
      margin: 0;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin: 40% auto;
      width: 80%;
      max-width: 300px;
    }

    .modal button {
      margin: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .demo-btn {
      background: #6c5ce7;
      color: white;
    }

    .buy-btn {
      background: #00b894;
      color: white;
    }
  </style>
</head>

<body>

<h1 id="pageTitle">Templates</h1>

<div class="templates-container" id="templatesContainer"></div>

<!-- MODAL -->
<div id="templateModal" class="modal">
  <div class="modal-content">
    <h3>Choose Option</h3>
    <button class="demo-btn" onclick="showDemo()">Show Demo</button>
    <button class="buy-btn" onclick="buyNow()">Buy Now</button>
  </div>
</div>

<script src="../scripts/templates-data.js"></script>

<script>

  let selectedTemplateId = "";

window.showDemo = function() {
  if (!selectedTemplateId) {
    alert("No template selected");
    return;
  }

  window.location.href = `../templates/${selectedTemplateId}/index.html`;
}

document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(window.location.search);
  const selectedStyle = params.get("style");

  console.log("Selected Style:", selectedStyle);
  console.log("All Templates:", window.TEMPLATES);

  // ✅ TITLE
  document.getElementById("pageTitle").innerText =
    selectedStyle ? selectedStyle.toUpperCase() + " Templates" : "Templates";

  // ✅ FILTER
  const filteredTemplates = window.TEMPLATES.filter(
    t => t.vibe === selectedStyle
  );

  console.log("Filtered:", filteredTemplates);

  // ❗ If empty → show message
  if (filteredTemplates.length === 0) {
    document.getElementById("templatesContainer").innerHTML =
      "<p>No templates found</p>";
    return;
  }

  // ✅ RENDER
  const container = document.getElementById("templatesContainer");

  filteredTemplates.forEach(template => {
    const div = document.createElement("div");
    div.className = "template-card";
    div.onclick = () => openModal(template.id);

    div.innerHTML = `
      <img src="${template.image}" />
      <h3>${template.title}</h3>
    `;

    container.appendChild(div);
  });

  // ✅ MODAL
  window.openModal = function(id) {
    selectedTemplateId = id;
    document.getElementById("templateModal").style.display = "block";
  }



  window.buyNow = function() {
    window.location.href = `payment.html?id=${selectedTemplateId}`;
  }

  window.onclick = function(e) {
    const modal = document.getElementById("templateModal");
    if (e.target === modal) {
      modal.style.display = "none";
    }
  }

});
</script>

</body>
</html>
