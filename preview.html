<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Template Preview</title>
  <link rel="stylesheet" href="styles/main.css">

  <style>
    body {
      margin: 0;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }

    .action-buttons {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>

<body>

  <iframe id="previewFrame"></iframe>

  <div class="action-buttons">
    <button onclick="goBack()">⬅ Back</button>
    <button onclick="buyNow()">💳 Buy</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
const templatePath = decodeURIComponent(params.get("template"));

document.getElementById("previewFrame").src = templatePath;

    if (templatePath) {
      frame.src = templatePath;
    }

    function goBack() {
      window.history.back();
    }

    function buyNow() {
      window.location.href = "payment.html";
    }
  </script>

</body>
</html>
