<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Style</title>

  <style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #f3e7ff, #e6f7ff);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
  }

  .back-btn {
    padding: 9px 18px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(45deg, #ff4d6d, #7b2cbf);
    color: white;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
  }

  .header-title {
    flex: 1;
    text-align: center;
  }

  .header-title h1 { color: #7b2cbf; font-size: clamp(20px, 5vw, 30px); }
  .header-title p { color: #888; font-size: 13px; margin-top: 4px; }

  .header-spacer { width: 80px; flex-shrink: 0; }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 0 16px 30px;
    max-width: 900px;
    margin: auto;
  }

  .card:last-child:nth-child(odd) { grid-column: 1 / -1; }

  .card {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: transform 0.25s;
  }

  .card:hover { transform: translateY(-4px); }
  .card:active { transform: scale(0.97); }

  .card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    filter: brightness(0.72);
  }

  .card-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 30px 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }

  .card-label h2 { color: white; font-size: 17px; margin: 0; }

  /* DESKTOP */
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(3, 1fr); padding: 0 24px 40px; }
    .card:last-child:nth-child(odd) { grid-column: auto; }
    .card img { height: 200px; }
  }

  /* SMALL PHONES */
  @media (max-width: 360px) {
    .grid { grid-template-columns: 1fr; }
    .card img { height: 150px; }
  }
</style>
</head>

<body>

<div class="header">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <div class="header-title">
    <h1>Choose Your Style</h1>
    <p>Select a vibe to preview your celebration page</p>
  </div>
  <div class="header-spacer"></div>
</div>

<div class="grid">

  <!-- Casual -->
  <div class="card" onclick="selectStyle('casual')">
    <img src="https://res.cloudinary.com/di8n4lsjz/image/upload/v1777389359/casual_xaue1t.jpg" loading="lazy"/>
      <div class="card-label"><h2>Casual</h2></div>
  </div>

  <!-- Traditional -->
  <div class="card" onclick="selectStyle('traditional')">
    <img src="https://res.cloudinary.com/di8n4lsjz/image/upload/v1777389119/Screenshot_2026-04-28_204053_vaf2am.png" />
      <div class="card-label"><h2>Traditional</h2></div>
  </div>

  <!-- Family -->
  <div class="card" onclick="selectStyle('family')">
    <img src="https://res.cloudinary.com/di8n4lsjz/image/upload/v1777389248/family_pj1lkr.jpg" />
      <div class="card-label"><h2>Family Time</h2></div>

  </div>

  <!-- Romantic -->
  <div class="card" onclick="selectStyle('romantic')">
    <img src="https://res.cloudinary.com/di8n4lsjz/image/upload/v1777388872/romantic_sloukt.jpg" />
      <div class="card-label"><h2>Romantic</h2></div>
  </div>

  <!-- Fun -->
  <div class="card" onclick="selectStyle('fun')">
    <img src="https://res.cloudinary.com/di8n4lsjz/image/upload/v1777389645/fun-quirky_qw0qd1.jpg" />
      <div class="card-label"><h2>Fun/Quirky</h2></div>
  </div>

</div>

<script>
  function selectStyle(style) {
  window.location.href = "template.html?style=" + style;
}

  function goBack() {
    window.history.back();
  }
</script>

</body>
</html>
