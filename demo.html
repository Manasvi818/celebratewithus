<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Style</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  text-align:center;
}

h1{
  margin-top:40px;
  font-size:32px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.card h3{
  margin:0;
}

/* Different colors */
.casual{background:#ffe4e6;}
.traditional{background:#fff7ed;}
.family{background:#ecfeff;}
.fun{background:#f0fdf4;}
.romantic{background:#fdf2f8;}

</style>
</head>

<body>

<h1>Choose Your Style 💖</h1>

<div class="grid">

  <div class="card casual" onclick="go('casual.html')">
    <h3>Casual</h3>
  </div>

  <div class="card traditional" onclick="go('traditional.html')">
    <h3>Traditional</h3>
  </div>

  <div class="card family" onclick="go('family.html')">
    <h3>Family Time</h3>
  </div>

  <div class="card fun" onclick="go('fun.html')">
    <h3>Fun & Quirky</h3>
  </div>

  <div class="card romantic" onclick="go('vintage-glory.html')">
    <h3>Romantic</h3>
  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
