<!DOCTYPE html>
<html>
<head>
  <title>Warm Bonds</title>
  <link rel="stylesheet" href="/assets/style.css">

  <style>
.demo-banner {
  position: fixed;
  top: 0;
  width: 100%;
  background: #ffd6e0;
  text-align: center;
  padding: 10px;
  font-weight: bold;
  z-index: 9999;
  font-family: sans-serif;
}

/* Prevent banner overlap */
body {
  margin-top: 50px;
}
</style>
</head>

<body>

  <div class="demo-banner">
  ⚠️ Demo Preview — Full version unlocks after purchase
</div>
  <button class="allow-demo">Click Me</button>

  <script>
document.addEventListener("DOMContentLoaded", function() {

// Disable all form submissions
document.querySelectorAll("form").forEach(form => {
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    showDemoPopup();
  });
});

// Disable all links
document.querySelectorAll("a[href^='http']").forEach(link => {
  link.addEventListener("click", (e) => {
    e.preventDefault();
    showDemoPopup();
  });
});

// Disable buttons (except allowed ones)
document.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", (e) => {
    if (!btn.classList.contains("allow-demo")) {
      e.preventDefault();
      showDemoPopup();
    }
  });
});

// Demo popup
function showDemoPopup() {
  alert("🚀 This is a demo preview.\nBuy the template to unlock full features!");
}

// Disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// Disable inspect (basic protection)
document.onkeydown = function(e) {
  if (e.keyCode == 123) return false;
};

});
</script>
</body>
</html>
